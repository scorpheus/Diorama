[package]
name = "rendu"
version = "0.1.0"
edition = "2021"
description = "Diorama : la forge que ClaudeTerminal peint, et les outils pour la regarder (planche, vitrine)"
license = "MIT"

[dependencies]
image-webp = "0.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
